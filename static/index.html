<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PublicGPT</title>
  <style>
    @font-face {
      font-family: "Gong Gothic Light";
      src: url("/static/GongGothicLight.ttf") format("truetype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-0: #fbfcfe;
      --bg-1: #eef4fb;
      --panel: rgba(255, 255, 255, 0.94);
      --panel-soft: rgba(248, 250, 253, 0.92);
      --panel-strong: rgba(255, 255, 255, 0.98);
      --line: rgba(148, 163, 184, 0.26);
      --line-strong: rgba(148, 163, 184, 0.4);
      --text: #1f2937;
      --muted: #64748b;
      --accent: #0f766e;
      --accent-2: #2563eb;
      --danger: #dc2626;
      --user-bg: linear-gradient(180deg, rgba(15, 118, 110, 0.08), rgba(15, 118, 110, 0.04));
      --assistant-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(247, 250, 252, 0.98));
      --shadow: 0 16px 36px rgba(148, 163, 184, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Gong Gothic Light", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 24%),
        radial-gradient(circle at 85% 10%, rgba(15, 118, 110, 0.08), transparent 20%),
        linear-gradient(160deg, var(--bg-0), var(--bg-1));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.6;
      pointer-events: none;
    }

    button,
    select,
    textarea,
    input {
      font: inherit;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      height: 100vh;
      overflow: hidden;
      transition: grid-template-columns 0.22s ease;
    }

    .app-shell::after {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      width: 260px;
      padding: 12px 10px;
      background: rgba(248, 251, 255, 0.78);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(14px);
      transition: transform 0.22s ease, opacity 0.18s ease;
      transform-origin: left center;
    }

    .app-shell.sidebar-collapsed {
      grid-template-columns: 0 minmax(0, 1fr);
    }

    .app-shell.sidebar-collapsed .sidebar {
      transform: translateX(-110%);
      opacity: 0;
      pointer-events: none;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 6px 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .brand-logo {
      width: 64px;
      height: auto;
      display: block;
      flex-shrink: 0;
    }

    .brand-label {
      font-family: "Gong Gothic Light", sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.04em;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }

    .icon-button:hover {
      background: rgba(255, 255, 255, 0.86);
      border-color: var(--line);
      transform: translateY(-1px);
    }

    .new-chat {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.84);
      color: var(--text);
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .new-chat:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, 0.94);
    }

    .nav-group {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
    }

    .nav-item-button {
      width: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      justify-content: space-between;
      text-align: left;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .nav-item-button:hover,
    .nav-item-button.active {
      background: rgba(255, 255, 255, 0.7);
      color: var(--text);
    }

    .nav-item-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .nav-chevron {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.18s ease;
    }

    .nav-item-button.collapsed .nav-chevron {
      transform: rotate(-90deg);
    }

    .icon-button svg,
    .nav-item svg,
    .new-chat svg,
    .chat-actions button svg,
    .composer-icon svg,
    .topbar-action svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-item.muted {
      color: var(--muted);
    }

    .section-header {
      margin: 18px 8px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .section-title {
      margin: 0;
      font-size: 12px;
      color: #8695ac;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .section-add {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(255, 255, 255, 0.74);
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }

    .section-add:hover {
      background: rgba(255, 255, 255, 0.96);
      border-color: rgba(37, 99, 235, 0.18);
      color: var(--accent-2);
    }

    .history {
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history::-webkit-scrollbar,
    .chat-scroll::-webkit-scrollbar {
      width: 6px;
    }

    .history::-webkit-scrollbar-thumb,
    .chat-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.32);
      border-radius: 999px;
    }

    .history-item {
      display: flex;
      align-items: stretch;
      gap: 6px;
      width: 100%;
      padding: 4px 0;
    }

    .history-item-main {
      flex: 1;
      min-width: 0;
      text-align: left;
      padding: 9px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .history-item-main:hover {
      background: rgba(255, 255, 255, 0.8);
      border-color: rgba(148, 163, 184, 0.18);
    }

    .history-item-main.active {
      background: rgba(255, 255, 255, 0.96);
      border-color: rgba(148, 163, 184, 0.28);
    }

    .history-item-main strong {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item-main span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-delete {
      width: 32px;
      flex-shrink: 0;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }

    .history-delete:hover {
      background: rgba(220, 38, 38, 0.08);
      border-color: rgba(220, 38, 38, 0.14);
      color: var(--danger);
    }

    .history-delete svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .project-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 4px 0 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
    }

    .project-header {
      display: flex;
      align-items: stretch;
      gap: 6px;
    }

    .project-main {
      flex: 1;
      min-width: 0;
      text-align: left;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.24);
      color: var(--text);
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .project-main:hover {
      background: rgba(255, 255, 255, 0.8);
      border-color: rgba(148, 163, 184, 0.18);
    }

    .project-main.active {
      background: rgba(255, 255, 255, 0.96);
      border-color: rgba(37, 99, 235, 0.16);
    }

    .project-main strong {
      display: block;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .project-main span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .project-chat-add {
      width: 36px;
      flex-shrink: 0;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }

    .project-chat-add:hover {
      background: rgba(37, 99, 235, 0.08);
      border-color: rgba(37, 99, 235, 0.14);
      color: var(--accent-2);
    }

    .project-chat-add svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .project-chats {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-left: 12px;
    }

    .project-empty {
      padding: 6px 10px 2px 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .history-item.child {
      padding: 0;
    }

    .history-item-main.child {
      padding-left: 12px;
    }

    .sidebar-footer {
      margin-top: 10px;
      padding: 12px 8px 2px;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .main {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 56px;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.55);
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      backdrop-filter: blur(10px);
    }

    .topbar-leading {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .topbar-title {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .topbar-title small {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-toggle-main {
      flex-shrink: 0;
    }

    .share-notice {
      display: none;
      width: min(100%, 820px);
      margin: 14px auto 0;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(37, 99, 235, 0.14);
      background: rgba(255, 255, 255, 0.76);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      box-shadow: 0 10px 24px rgba(148, 163, 184, 0.1);
      backdrop-filter: blur(10px);
    }

    .share-notice.show {
      display: block;
    }

    .topbar-action,
    .control-pill {
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      border-radius: 999px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
    }

    .topbar-action {
      cursor: pointer;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 14px 0 0;
      width: min(100%, 820px);
      margin: 0 auto;
    }

    .control-pill select,
    .control-pill input {
      border: 0;
      background: transparent;
      color: inherit;
      outline: none;
    }

    .chat-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      padding: 0 20px 18px;
    }

    .chat-column {
      width: min(100%, 820px);
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .chat-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 6px 172px 0;
    }

    .welcome {
      margin: 72px auto 0;
      width: min(100%, 680px);
      text-align: center;
      padding: 12px 0 0;
    }

    .welcome h3 {
      margin: 0 0 10px;
      font-family: "Gong Gothic Light", sans-serif;
      font-size: 32px;
      letter-spacing: -0.04em;
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 15px;
    }

    .message-list {
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding: 12px 0 0;
    }

    .message {
      display: flex;
      width: 100%;
      animation: rise 0.18s ease;
    }

    .message.assistant {
      justify-content: flex-start;
    }

    .message.user {
      justify-content: flex-end;
    }

    .assistant-block {
      width: min(100%, 740px);
    }

    .assistant-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .assistant-badge {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.12), rgba(37, 99, 235, 0.12));
      border: 1px solid rgba(37, 99, 235, 0.16);
      color: var(--accent-2);
      font-family: "Gong Gothic Light", sans-serif;
      font-size: 11px;
      font-weight: 700;
    }

    .assistant-name {
      font-size: 15px;
      font-weight: 700;
    }

    .assistant-mode {
      color: var(--muted);
      font-size: 12px;
    }

    .assistant-content {
      font-size: 15px;
      line-height: 1.82;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .chat-actions {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }

    .chat-actions button {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: inherit;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .chat-actions button:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(148, 163, 184, 0.18);
    }

    .user-bubble {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: min(78%, 460px);
      padding: 12px 16px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 8px 18px rgba(148, 163, 184, 0.12);
      font-size: 15px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user-bubble.has-image {
      width: min(100%, 360px);
      max-width: min(72%, 360px);
      padding: 10px;
    }

    .user-image {
      display: block;
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 10px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(248, 250, 253, 0.92);
    }

    .user-image-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .user-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .typing {
      display: none;
      align-items: center;
      gap: 10px;
      padding-top: 8px;
    }

    .typing.show {
      display: flex;
    }

    .typing-badge {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.12), rgba(37, 99, 235, 0.12));
      border: 1px solid rgba(37, 99, 235, 0.16);
      color: var(--accent-2);
      font-family: "Gong Gothic Light", sans-serif;
      font-size: 11px;
      font-weight: 700;
    }

    .typing-bubble {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(255, 255, 255, 0.9);
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--muted);
      animation: blink 1s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    .composer-wrap {
      position: sticky;
      bottom: 0;
      margin-top: auto;
      padding: 0 0 8px;
      background: linear-gradient(180deg, rgba(251, 252, 254, 0), rgba(251, 252, 254, 0.84) 18%, rgba(251, 252, 254, 0.98) 42%);
    }

    .composer {
      border-radius: 28px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 14px 34px rgba(148, 163, 184, 0.16);
      overflow: hidden;
      backdrop-filter: blur(16px);
    }

    .attachment-status {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .attachment-status.show {
      display: flex;
    }

    .attachment-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.14);
      color: var(--accent-2);
    }

    .attachment-pill span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-preview {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(37, 99, 235, 0.14);
      flex-shrink: 0;
    }

    .attachment-preview.hidden {
      display: none;
    }

    .attachment-clear {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 999px;
    }

    .attachment-clear:hover {
      background: rgba(148, 163, 184, 0.12);
    }

    .composer-main {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 14px;
    }

    .composer-icon {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .composer-icon:hover {
      background: rgba(248, 250, 253, 0.98);
      border-color: rgba(148, 163, 184, 0.18);
    }

    .composer textarea {
      flex: 1;
      min-height: 28px;
      max-height: 220px;
      resize: none;
      border: 0;
      outline: none;
      padding: 8px 0 6px;
      background: transparent;
      color: var(--text);
      line-height: 1.6;
      font-size: 16px;
    }

    .composer textarea::placeholder {
      color: #8b9aad;
    }

    .send {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: 0;
      border-radius: 999px;
      background: #111827;
      color: #ffffff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .send:hover {
      transform: translateY(-1px);
    }

    .send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    body.share-mode .app-shell {
      grid-template-columns: minmax(0, 1fr);
    }

    body.share-mode .sidebar,
    body.share-mode .control-row,
    body.share-mode .sidebar-toggle-main,
    body.share-mode .composer-wrap {
      display: none;
    }

    body.share-mode .chat-column {
      width: min(100%, 920px);
    }

    body.share-mode .chat-scroll {
      padding-bottom: 40px;
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.35; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 960px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 25;
        box-shadow: 0 24px 48px rgba(15, 23, 42, 0.18);
        transform: translateX(-110%);
        opacity: 0;
        pointer-events: none;
      }

      .app-shell.sidebar-open::after {
        opacity: 1;
        pointer-events: auto;
      }

      .app-shell.sidebar-open .sidebar {
        transform: translateX(0);
        opacity: 1;
        pointer-events: auto;
      }

      .topbar {
        padding-left: 14px;
        padding-right: 14px;
      }

      .chat-stage {
        padding-left: 14px;
        padding-right: 14px;
      }

      .control-row {
        padding-left: 0;
        padding-right: 0;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 720px) {
      .topbar-actions {
        display: none;
      }

      .control-row {
        gap: 6px;
      }

      .control-pill {
        width: 100%;
        justify-content: space-between;
      }

      .welcome {
        margin-top: 34px;
      }

      .welcome h3 {
        font-size: 28px;
      }

      .assistant-block,
      .user-bubble {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <img class="brand-logo" src="/static/swf-logo.svg" alt="PublicGPT logo">
          <div class="brand-label">PublicGPT</div>
        </div>
        <button class="icon-button" id="sidebarToggleBtn" type="button" aria-label="사이드바 접기" aria-expanded="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 7h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 17h16"></path>
          </svg>
        </button>
      </div>

      <button class="new-chat" id="newChatBtn" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M12 5v14"></path>
          <path d="M5 12h14"></path>
        </svg>
        <span>새 채팅</span>
      </button>

      <div class="nav-group">
        <div class="nav-item">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
          <span>채팅 검색</span>
        </div>
        <button class="nav-item nav-item-button muted" id="projectNavBtn" type="button">
          <span class="nav-item-left">
            <svg viewBox="0 0 24 24">
              <path d="M4 7h7"></path>
              <path d="M4 12h10"></path>
              <path d="M4 17h5"></path>
              <path d="M16 5v14"></path>
              <path d="M12 9h8"></path>
            </svg>
            <span>프로젝트</span>
          </span>
          <svg class="nav-chevron" viewBox="0 0 24 24">
            <path d="m9 6 6 6-6 6"></path>
          </svg>
        </button>
      </div>

      <div class="section-header">
        <div class="section-title">채팅 목록</div>
        <button class="section-add" id="addProjectBtn" type="button" aria-label="새 프로젝트 추가">
          <svg viewBox="0 0 24 24">
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
          </svg>
        </button>
      </div>
      <div class="history" id="historyList"></div>

    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-leading">
          <button class="icon-button sidebar-toggle-main" id="sidebarRevealBtn" type="button" aria-label="사이드바 펼치기" aria-expanded="true">
            <svg viewBox="0 0 24 24">
              <path d="M4 7h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 17h16"></path>
            </svg>
          </button>
          <div class="topbar-title">
            <span id="chatTitle">PublicGPT</span>
            <small id="topbarSubtitle">OpenAI chat</small>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="topbar-action" id="shareChatBtn" type="button">
            <svg viewBox="0 0 24 24">
              <path d="M12 16V4"></path>
              <path d="m7 9 5-5 5 5"></path>
              <path d="M5 20h14"></path>
            </svg>
            <span id="shareChatLabel">공유</span>
          </button>
          <button class="topbar-action" type="button" aria-label="More actions">
            <svg viewBox="0 0 24 24">
              <circle cx="5" cy="12" r="1.5"></circle>
              <circle cx="12" cy="12" r="1.5"></circle>

      <div class="chat-stage">
        <div class="chat-column">
          <div class="control-row">

          <div class="chat-scroll" id="messagesPanel">

              <p>긴 대화도 계속 이어질 수 있도록, 대화 흐름에 집중한 ChatGPT 스타일 레이아웃으로 정리했습니다.</p>

              <div class="attachment-status" id="attachmentStatus">
                <div class="attachment-pill">
                  <img class="attachment-preview" id="attachmentPreview" alt="Attached preview">
                  <span id="attachmentName"></span>
                </div>
                <button class="attachment-clear" id="clearAttachmentBtn" type="button">제거</button>
              </div>
              <div class="composer-main">
                <button class="composer-icon" id="attachBtn" type="button" aria-label="Attach image or PDF for OCR">

                <input id="ocrFileInput" type="file" hidden>
                <textarea id="messageInput" placeholder="무엇이든 물어보세요"></textarea>
                <button class="composer-icon" type="button" aria-label="Voice">
                  <svg viewBox="0 0 24 24">
                    <path d="M12 4a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V7a3 3 0 0 1 3-3Z"></path>
                    <path d="M19 11a7 7 0 0 1-14 0"></path>

                  </svg>

  </div>

  <script>
    const API = window.location.origin;
    const shareQueryChatId = new URLSearchParams(window.location.search).get("share");
    const SIDEBAR_STORAGE_KEY = "publicgpt.sidebarOpen";
    const DEFAULT_WELCOME_TITLE = "무엇을 도와드릴까요?";
    const DEFAULT_WELCOME_TEXT = "긴 대화도 계속 이어질 수 있도록, 대화 흐름에 집중한 ChatGPT 스타일 레이아웃으로 정리했습니다.";
    const DEFAULT_PROJECT_NAME = "새 채팅";
    const state = {
      projects: {},
      chats: {},
      currentProjectId: null,
      currentChatId: null,
      projectsCollapsed: false,
      shareChatId: shareQueryChatId ? shareQueryChatId.trim() || null : null,
      sidebarOpen: true,
      loading: false,
    };

    const appShell = document.getElementById("appShell");
    const sidebarToggleBtn = document.getElementById("sidebarToggleBtn");
    const sidebarRevealBtn = document.getElementById("sidebarRevealBtn");
    const historyList = document.getElementById("historyList");
    const projectNavBtn = document.getElementById("projectNavBtn");
    const addProjectBtn = document.getElementById("addProjectBtn");
    const chatTitle = document.getElementById("chatTitle");
    const topbarSubtitle = document.getElementById("topbarSubtitle");
    const shareNotice = document.getElementById("shareNotice");
    const shareChatBtn = document.getElementById("shareChatBtn");
    const shareChatLabel = document.getElementById("shareChatLabel");
    const modelSelect = document.getElementById("modelSelect");
    const webSearchToggle = document.getElementById("webSearchToggle");
    const messagesPanel = document.getElementById("messagesPanel");
    const messageList = document.getElementById("messageList");
    const welcomeCard = document.getElementById("welcomeCard");
    const welcomeTitle = welcomeCard.querySelector("h3");
    const welcomeText = welcomeCard.querySelector("p");
    const typingRow = document.getElementById("typingRow");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const attachBtn = document.getElementById("attachBtn");
    const ocrFileInput = document.getElementById("ocrFileInput");
    const attachmentStatus = document.getElementById("attachmentStatus");
    const attachmentPreview = document.getElementById("attachmentPreview");
    const attachmentName = document.getElementById("attachmentName");
    const clearAttachmentBtn = document.getElementById("clearAttachmentBtn");
    let pendingImageFile = null;
    let pendingImagePreviewUrl = "";
    let shareButtonTimerId = null;

    try {
      const savedSidebarPreference = window.localStorage.getItem(SIDEBAR_STORAGE_KEY);
      if (savedSidebarPreference === "true" || savedSidebarPreference === "false") {
        state.sidebarOpen = savedSidebarPreference === "true";
      } else {
        state.sidebarOpen = window.innerWidth > 960;
      }
    } catch (error) {
      state.sidebarOpen = window.innerWidth > 960;
    }

    function generateId(prefix) {
      return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
    }

    function getProject(projectId) {
      return projectId ? state.projects[projectId] || null : null;
    }

    function getCurrentChat() {
      return state.currentChatId ? state.chats[state.currentChatId] || null : null;
    }

    function isShareMode() {
      return Boolean(state.shareChatId);
    }

    function isDesktopViewport() {
      return window.innerWidth > 960;
    }

    function applySidebarState() {
      const desktop = isDesktopViewport();
      const sidebarVisible = !isShareMode() && state.sidebarOpen;
      appShell.classList.toggle("sidebar-collapsed", desktop && !sidebarVisible);
      appShell.classList.toggle("sidebar-open", !desktop && sidebarVisible);
      sidebarToggleBtn.setAttribute("aria-expanded", sidebarVisible ? "true" : "false");
      sidebarRevealBtn.setAttribute("aria-expanded", sidebarVisible ? "true" : "false");
      sidebarToggleBtn.setAttribute("aria-label", sidebarVisible ? "사이드바 접기" : "사이드바 펼치기");
      sidebarRevealBtn.setAttribute("aria-label", sidebarVisible ? "사이드바 접기" : "사이드바 펼치기");
    }

    function setSidebarOpen(nextOpen) {
      state.sidebarOpen = Boolean(nextOpen);
      applySidebarState();
      try {
        window.localStorage.setItem(SIDEBAR_STORAGE_KEY, String(state.sidebarOpen));
      } catch (error) {
        console.warn("Failed to store sidebar preference", error);
      }
    }

    function toggleSidebar() {
      setSidebarOpen(!state.sidebarOpen);
    }

    function setShareMode(enabled) {
      document.body.classList.toggle("share-mode", enabled);
      appShell.classList.toggle("share-mode", enabled);
      topbarSubtitle.textContent = enabled ? "공유된 채팅" : "OpenAI chat";
      applySidebarState();
    }

    function setWelcomeContent(title, text) {
      welcomeTitle.textContent = title;
      welcomeText.textContent = text;
    }

    function setShareNotice(chat) {
      if (!isShareMode()) {
        shareNotice.classList.remove("show");
        shareNotice.textContent = "";
        setWelcomeContent(DEFAULT_WELCOME_TITLE, DEFAULT_WELCOME_TEXT);
        return;
      }

      shareNotice.classList.add("show");
      if (chat) {
        shareNotice.textContent = "읽기 전용 공유 링크입니다. 상단 공유 버튼으로 이 페이지 주소를 다시 복사할 수 있습니다.";
        setWelcomeContent("공유된 채팅", "이 링크는 읽기 전용입니다.");
      } else {
        shareNotice.textContent = "공유된 채팅을 찾을 수 없습니다. 링크가 잘못되었거나 원본 채팅이 삭제되었을 수 있습니다.";
        setWelcomeContent("채팅을 찾을 수 없습니다", "링크가 만료되었거나 삭제된 채팅입니다.");
      }
    }

    function buildShareUrl(chatId) {
      const url = new URL("/ui", window.location.origin);
      url.searchParams.set("share", chatId);
      return url.toString();
    }

    function updateShareButton(label) {
      shareChatLabel.textContent = label;
      if (shareButtonTimerId) {
        clearTimeout(shareButtonTimerId);
      }
      if (label === "공유") {
        shareButtonTimerId = null;
        return;
      }
      shareButtonTimerId = window.setTimeout(() => {
        shareChatLabel.textContent = "공유";
        shareButtonTimerId = null;
      }, 1800);
    }

    async function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (error) {
          console.warn("Clipboard API copy failed", error);
        }
      }

      const helper = document.createElement("textarea");
      helper.value = text;
      helper.setAttribute("readonly", "");
      helper.style.position = "fixed";
      helper.style.opacity = "0";
      helper.style.pointerEvents = "none";
      document.body.appendChild(helper);
      helper.focus();
      helper.select();

      try {
        return document.execCommand("copy");
      } catch (error) {
        console.warn("execCommand copy failed", error);
        return false;
      } finally {
        document.body.removeChild(helper);
      }
    }

    async function handleShareChat() {
      const chat = getCurrentChat();
      if (!chat) {
        window.alert("공유할 채팅을 먼저 선택해 주세요.");
        return;
      }

      const shareUrl = buildShareUrl(chat.id);
      const copied = await copyTextToClipboard(shareUrl);
      if (copied) {
        updateShareButton("링크 복사됨");
        return;
      }

      window.prompt("이 링크를 복사하세요.", shareUrl);
      updateShareButton("링크 열기");
    }

    function getSortedProjectIds() {
      return Object.keys(state.projects).sort(
        (a, b) => (state.projects[b]?.createdAt || 0) - (state.projects[a]?.createdAt || 0)
      );
    }

    function ensureDefaultProject() {
      const ids = Object.keys(state.projects);
      if (ids.length) {
        return ids[0];
      }
      const id = generateId("project");
      state.projects[id] = {
        id,
        name: DEFAULT_PROJECT_NAME,
        chatIds: [],
        createdAt: Date.now(),
      };
      state.currentProjectId = id;
      return id;
    }

    function createProject(name = "새 프로젝트") {
      const trimmed = (name || "").trim() || "새 프로젝트";
      const id = generateId("project");
      state.projects[id] = {
        id,
        name: trimmed,
        chatIds: [],
        createdAt: Date.now(),
      };
      state.currentProjectId = id;
      state.currentChatId = null;
      state.projectsCollapsed = false;
      renderHistory();
      renderCurrentChat(false);
      saveChats();
      return id;
    }

    function createChat(projectId = state.currentProjectId) {
      const resolvedProjectId = projectId || ensureDefaultProject();
      const project = getProject(resolvedProjectId);
      const id = generateId("chat");
      state.chats[id] = {
        id,
        title: "새 채팅",
        messages: [],
        createdAt: Date.now(),
        projectId: resolvedProjectId,
      };
      project.chatIds = [id, ...(project.chatIds || []).filter((chatId) => chatId !== id)];
      state.currentProjectId = resolvedProjectId;
      state.currentChatId = id;
      renderHistory();
      renderCurrentChat(true);
      saveChats();
      return state.chats[id];
    }

    function ensureChat(projectId = state.currentProjectId) {
      const chat = getCurrentChat();
      if (chat) {
        return chat;
      }
      return createChat(projectId);
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value || "";
      return div.innerHTML;
    }

    function chatPreview(chat) {
      const last = chat.messages[chat.messages.length - 1];
      return last ? last.content.slice(0, 42) : "새 대화를 시작해 보세요.";
    }

    function normalizeUiState(payload) {
      const normalized = {
        projects: {},
        chats: {},
        currentProjectId: null,
        currentChatId: null,
      };

      const defaultProjectId = generateId("project");
      const payloadProjects = payload && typeof payload.projects === "object" ? payload.projects : null;
      const payloadChats = payload && typeof payload.chats === "object" ? payload.chats : {};

      if (payloadProjects && Object.keys(payloadProjects).length) {
        Object.entries(payloadProjects).forEach(([projectId, project]) => {
          if (!project || typeof project !== "object") {
            return;
          }
          normalized.projects[projectId] = {
            id: projectId,
            name: ((project.name || "프로젝트").toString() === "기본 프로젝트"
              ? DEFAULT_PROJECT_NAME
              : (project.name || "프로젝트").toString()),
            createdAt: Number(project.createdAt) || Date.now(),
            chatIds: Array.isArray(project.chatIds) ? project.chatIds.filter((chatId) => typeof chatId === "string") : [],
          };
        });
      }

      Object.entries(payloadChats || {}).forEach(([chatId, chat]) => {
        if (!chat || typeof chat !== "object") {
          return;
        }
        normalized.chats[chatId] = {
          ...chat,
          id: chatId,
          title: (chat.title || "새 채팅").toString(),
          messages: Array.isArray(chat.messages) ? chat.messages : [],
          createdAt: Number(chat.createdAt) || Date.now(),
          projectId: typeof chat.projectId === "string" ? chat.projectId : null,
        };
      });

      if (!Object.keys(normalized.projects).length) {
        normalized.projects[defaultProjectId] = {
          id: defaultProjectId,
          name: DEFAULT_PROJECT_NAME,
          createdAt: Date.now(),
          chatIds: [],
        };
      }

      Object.values(normalized.projects).forEach((project) => {
        project.chatIds = (project.chatIds || []).filter((chatId) => normalized.chats[chatId]);
      });

      const referenced = new Set();
      Object.values(normalized.projects).forEach((project) => {
        project.chatIds.forEach((chatId) => {
          referenced.add(chatId);
          if (normalized.chats[chatId]) {
            normalized.chats[chatId].projectId = project.id;
          }
        });
      });

      let fallbackProjectId = Object.keys(normalized.projects)[0];
      Object.values(normalized.chats)
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
        .forEach((chat) => {
          const projectId = chat.projectId && normalized.projects[chat.projectId] ? chat.projectId : fallbackProjectId;
          chat.projectId = projectId;
          if (!referenced.has(chat.id)) {
            normalized.projects[projectId].chatIds.push(chat.id);
          }
        });

      normalized.currentProjectId =
        payload && normalized.projects[payload.currentProjectId]
          ? payload.currentProjectId
          : (normalized.chats[payload?.currentChatId]?.projectId || fallbackProjectId);
      normalized.currentChatId =
        payload && normalized.chats[payload.currentChatId] ? payload.currentChatId : null;

      return normalized;
    }

    function selectProject(projectId, preferredChatId = null) {
      const project = getProject(projectId);
      if (!project) {
        return;
      }
      state.currentProjectId = projectId;
      state.currentChatId =
        preferredChatId && state.chats[preferredChatId]
          ? preferredChatId
          : (project.chatIds || []).find((chatId) => state.chats[chatId]) || null;
      renderHistory();
      renderCurrentChat(false);
      if (!isDesktopViewport()) {
        setSidebarOpen(false);
      }
    }

    function selectFallbackChat(projectId = state.currentProjectId) {
      const preferredProject = getProject(projectId);
      const preferredChatId = preferredProject
        ? (preferredProject.chatIds || []).find((chatId) => state.chats[chatId]) || null
        : null;
      if (preferredProject) {
        state.currentProjectId = preferredProject.id;
      }
      if (preferredChatId) {
        state.currentChatId = preferredChatId;
        renderHistory();
        renderCurrentChat(false);
        return;
      }

      const allProjectIds = getSortedProjectIds();
      for (const nextProjectId of allProjectIds) {
        const nextProject = getProject(nextProjectId);
        const nextChatId = (nextProject?.chatIds || []).find((chatId) => state.chats[chatId]) || null;
        if (nextProject) {
          state.currentProjectId = nextProjectId;
        }
        if (nextChatId) {
          state.currentChatId = nextChatId;
          renderHistory();
          renderCurrentChat(false);
          return;
        }
      }

      state.currentChatId = null;
      if (!state.currentProjectId) {
        state.currentProjectId = ensureDefaultProject();
      }
      renderHistory();
      renderCurrentChat(false);
    }

    function deleteChat(chatId) {
      const chat = state.chats[chatId];
      if (!chat) {
        return;
      }
      const projectId = chat.projectId;
      const project = getProject(projectId);
      if (project) {
        project.chatIds = (project.chatIds || []).filter((id) => id !== chatId);
      }
      delete state.chats[chatId];

      if (state.currentChatId === chatId) {
        state.currentChatId = null;
        selectFallbackChat(projectId);
      } else {
        renderHistory();
        renderCurrentChat(false);
      }

      saveChats();
    }

    function renderHistory() {
      historyList.innerHTML = "";
      projectNavBtn.classList.toggle("collapsed", state.projectsCollapsed);
      projectNavBtn.classList.toggle("active", !state.projectsCollapsed);
      addProjectBtn.hidden = state.projectsCollapsed;
      historyList.style.display = state.projectsCollapsed ? "none" : "flex";

      if (state.projectsCollapsed) {
        return;
      }

      const projectIds = getSortedProjectIds();

      if (!projectIds.length) {
        const empty = document.createElement("div");
        empty.className = "history-item";
        empty.innerHTML = '<div class="history-item-main"><strong>프로젝트 없음</strong><span>새 프로젝트를 만들어 보세요.</span></div>';
        historyList.appendChild(empty);
        return;
      }

      projectIds.forEach((projectId) => {
        const project = getProject(projectId);
        if (!project) {
          return;
        }

        const card = document.createElement("div");
        card.className = "project-card";

        const header = document.createElement("div");
        header.className = "project-header";

        const projectBtn = document.createElement("button");
        projectBtn.type = "button";
        projectBtn.className = "project-main" + (projectId === state.currentProjectId ? " active" : "");
        projectBtn.innerHTML = `
          <strong>${escapeHtml(project.name)}</strong>
          <span>${(project.chatIds || []).length}개 채팅</span>
        `;
        projectBtn.addEventListener("click", () => selectProject(projectId));

        const addChatBtn = document.createElement("button");
        addChatBtn.type = "button";
        addChatBtn.className = "project-chat-add";
        addChatBtn.setAttribute("aria-label", `${project.name}에 새 채팅 추가`);
        addChatBtn.innerHTML = `
          <svg viewBox="0 0 24 24">
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
          </svg>
        `;
        addChatBtn.addEventListener("click", () => createChat(projectId));

        header.appendChild(projectBtn);
        header.appendChild(addChatBtn);
        card.appendChild(header);

        const children = document.createElement("div");
        children.className = "project-chats";
        const chats = (project.chatIds || [])
          .map((chatId) => state.chats[chatId])
          .filter(Boolean);

        if (!chats.length) {
          const empty = document.createElement("div");
          empty.className = "project-empty";
          empty.textContent = "아직 채팅이 없어요. + 버튼으로 시작해보세요.";
          children.appendChild(empty);
        }

        chats.forEach((chat) => {
          const row = document.createElement("div");
          row.className = "history-item child";

          const item = document.createElement("button");
          item.type = "button";
          item.className = "history-item-main child" + (chat.id === state.currentChatId ? " active" : "");
          item.innerHTML = `<strong>${escapeHtml(chat.title)}</strong><span>${escapeHtml(chatPreview(chat))}</span>`;
          item.addEventListener("click", () => {
            state.currentProjectId = projectId;
            state.currentChatId = chat.id;
            renderHistory();
            renderCurrentChat(false);
            if (!isDesktopViewport()) {
              setSidebarOpen(false);
            }
          });

          const deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "history-delete";
          deleteBtn.setAttribute("aria-label", `${chat.title} 삭제`);
          deleteBtn.innerHTML = `
            <svg viewBox="0 0 24 24">
              <path d="M4 7h16"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
              <path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"></path>
              <path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"></path>
            </svg>
          `;
          deleteBtn.addEventListener("click", () => deleteChat(chat.id));

          row.appendChild(item);
          row.appendChild(deleteBtn);
          children.appendChild(row);
        });

        card.appendChild(children);
        historyList.appendChild(card);
      });
    }

    function messageActions() {
      return `
        <div class="chat-actions">
          <button type="button" aria-label="Copy">
            <svg viewBox="0 0 24 24">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M5 15V6a2 2 0 0 1 2-2h9"></path>
            </svg>
          </button>
          <button type="button" aria-label="Retry">
            <svg viewBox="0 0 24 24">
              <path d="M3 12a9 9 0 1 0 3-6.708"></path>
              <path d="M3 4v5h5"></path>
            </svg>
          </button>
          <button type="button" aria-label="More">
            <svg viewBox="0 0 24 24">
              <circle cx="5" cy="12" r="1.5"></circle>
              <circle cx="12" cy="12" r="1.5"></circle>
              <circle cx="19" cy="12" r="1.5"></circle>
            </svg>
          </button>
        </div>
      `;
    }

    function renderMessages(messages) {
      messageList.innerHTML = "";

      messages.forEach((message) => {
        const article = document.createElement("article");
        article.className = "message " + message.role;

        if (message.role === "user") {
          const imageBlock = message.imagePreviewUrl
            ? `<img class="user-image" src="${escapeHtml(message.imagePreviewUrl)}" alt="${escapeHtml(message.imageName || "attached image")}">`
            : "";
          const imageLabel = message.imageName
            ? `<span class="user-image-label">첨부 이미지: ${escapeHtml(message.imageName)}</span>`
            : "";
          const textBlock = message.content
            ? `<div class="user-text">${escapeHtml(message.content)}</div>`
            : "";
          article.innerHTML = `
            <div class="user-bubble${message.imagePreviewUrl ? " has-image" : ""}">
              ${imageBlock}
              ${imageLabel}
              ${textBlock}
            </div>
          `;
        } else {
          const mode = message.mode ? `<div class="assistant-mode">${escapeHtml(message.mode)}</div>` : "";
          article.innerHTML = `
            <div class="assistant-block">
              <div class="assistant-head">
                <div class="assistant-badge">AI</div>
                <div class="assistant-name">PublicGPT</div>
                ${mode}
              </div>
              <div class="assistant-content">${escapeHtml(message.content)}</div>
              ${messageActions()}
            </div>
          `;
        }

        messageList.appendChild(article);
      });
    }

    function renderCurrentChat(scrollToEnd) {
      const chat = getCurrentChat();
      const project = getProject(state.currentProjectId);
      chatTitle.textContent = chat ? chat.title : (project?.name || "PublicGPT");
      setShareNotice(chat);
      document.title = isShareMode()
        ? `${chat ? chat.title : "공유된 채팅"} - PublicGPT`
        : "PublicGPT";
      renderMessages(chat ? chat.messages : []);
      welcomeCard.style.display = chat && chat.messages.length ? "none" : "block";
      if (scrollToEnd) {
        scrollMessagesToBottom();
      }
    }

    function scrollMessagesToBottom() {
      requestAnimationFrame(() => {
        messagesPanel.scrollTop = messagesPanel.scrollHeight;
      });
    }

    function autoResizeTextarea() {
      messageInput.style.height = "0px";
      messageInput.style.height = Math.min(messageInput.scrollHeight, 220) + "px";
    }

    function revokeImagePreview(url) {
      if (url && url.startsWith("blob:")) {
        URL.revokeObjectURL(url);
      }
    }

    function serializeUiStateForSave() {
      const serializedChats = {};
      Object.entries(state.chats).forEach(([chatId, chat]) => {
        serializedChats[chatId] = {
          ...chat,
          messages: (chat.messages || []).map((message) => {
            const next = { ...message };
            delete next.imagePreviewUrl;
            return next;
          }),
        };
      });
      return {
        projects: state.projects,
        chats: serializedChats,
        currentProjectId: state.currentProjectId,
        currentChatId: state.currentChatId,
      };
    }

    function setPendingImage(file) {
      revokeImagePreview(pendingImagePreviewUrl);
      pendingImageFile = file;
      pendingImagePreviewUrl = "";
      if (!file) {
        attachmentStatus.classList.remove("show");
        attachmentPreview.removeAttribute("src");
        attachmentPreview.classList.add("hidden");
        attachmentName.textContent = "";
        attachBtn.title = "";
        return;
      }
      if ((file.type || "").startsWith("image/")) {
        pendingImagePreviewUrl = URL.createObjectURL(file);
        attachmentPreview.src = pendingImagePreviewUrl;
        attachmentPreview.classList.remove("hidden");
      } else {
        attachmentPreview.removeAttribute("src");
        attachmentPreview.classList.add("hidden");
      }
      attachmentStatus.classList.add("show");
      attachmentName.textContent = file.name || "붙여넣은 이미지";
      attachBtn.title = "파일 첨부됨";
    }

    function clearPendingImage(revokePreview = true) {
      if (revokePreview) {
        revokeImagePreview(pendingImagePreviewUrl);
      }
      pendingImageFile = null;
      pendingImagePreviewUrl = "";
      ocrFileInput.value = "";
      attachmentStatus.classList.remove("show");
      attachmentPreview.removeAttribute("src");
      attachmentPreview.classList.add("hidden");
      attachmentName.textContent = "";
      attachBtn.title = "";
    }

    async function runOcr(file) {
      const formData = new FormData();
      formData.append("file", file);

      const response = await fetch(API + "/ocr", {
        method: "POST",
        body: formData,
      });

      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.detail || "OCR request failed");
      }
      return payload.text || "";
    }

    async function processOcrFile(file) {
      if (!file) {
        return;
      }

      const previousTitle = attachBtn.title;
      attachBtn.disabled = true;
      attachBtn.title = "OCR 처리 중";

      try {
        const text = await runOcr(file);
        return (text || "").trim();
      } catch (error) {
        throw error;
      } finally {
        attachBtn.disabled = false;
        attachBtn.title = previousTitle;
      }
    }

    function handleOcrSelection(event) {
      const file = event.target.files && event.target.files[0];
      setPendingImage(file);
    }

    function handleImagePaste(event) {
      const items = Array.from(event.clipboardData?.items || []);
      const imageItem = items.find((item) => item.kind === "file" && item.type.startsWith("image/"));
      if (!imageItem) {
        return;
      }

      const file = imageItem.getAsFile();
      if (!file) {
        return;
      }

      event.preventDefault();
      setPendingImage(file);
    }

    async function loadModels() {
      try {
        const response = await fetch(API + "/models");
        const payload = await response.json();
        modelSelect.innerHTML = "";
        (payload.available || []).forEach((model) => {
          const option = document.createElement("option");
          option.value = model.trim();
          option.textContent = model.trim();
          if (model.trim() === payload.default) {
            option.selected = true;
          }
          modelSelect.appendChild(option);
        });
      } catch (error) {
        console.warn("Failed to load models", error);
      }
    }

    async function loadHealth() {
      try {
        await fetch(API + "/health");
      } catch (error) {
        console.warn("Failed to load health", error);
      }
    }

    async function loadChats() {
      try {
        const response = await fetch(API + "/ui-state/chats");
        const payload = await response.json();
        const normalized = normalizeUiState(payload || {});
        state.projects = normalized.projects;
        state.chats = normalized.chats;
        state.currentProjectId = normalized.currentProjectId;
        state.currentChatId = normalized.currentChatId;
      } catch (error) {
        state.projects = {};
        state.chats = {};
        state.currentProjectId = null;
        state.currentChatId = null;
      }

      if (isShareMode()) {
        const sharedChat = state.shareChatId ? state.chats[state.shareChatId] || null : null;
        state.currentProjectId = sharedChat?.projectId || null;
        state.currentChatId = sharedChat?.id || null;
        setShareMode(true);
        renderHistory();
        renderCurrentChat(false);
        return;
      }

      setShareMode(false);
      ensureDefaultProject();
      if (!state.currentProjectId) {
        state.currentProjectId = getSortedProjectIds()[0] || null;
      }
      if (!state.currentChatId) {
        selectFallbackChat(state.currentProjectId);
        return;
      }
      renderHistory();
      renderCurrentChat(false);
    }

    async function saveChats() {
      try {
        await fetch(API + "/ui-state/chats", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(serializeUiStateForSave()),
        });
      } catch (error) {
        console.warn("Failed to save chats", error);
      }
    }

    function buildHistory(messages) {
      return messages.map((message) => ({
        role: message.role,
        content: message.content,
      }));
    }

    async function sendMessage() {
      if (isShareMode()) {
        return;
      }

      if (state.loading) {
        return;
      }

      const text = messageInput.value.trim();
      if (!text && !pendingImageFile) {
        return;
      }

      const pendingFile = pendingImageFile;
      const pendingPreviewUrl = pendingImagePreviewUrl;
      const isImageFile = pendingFile && (pendingFile.type || "").startsWith("image/");
      const attachmentLabel = isImageFile ? "이미지" : "파일";
      const requestSubject = isImageFile ? "이미지" : "PDF 파일";
      const userDisplayText = text || `[${attachmentLabel} 첨부]`;
      const requestMessage = text || `첨부한 ${requestSubject}의 텍스트를 읽고 핵심 내용을 설명해줘.`;

      const chat = ensureChat(state.currentProjectId);
      if (chat.title === "새 채팅") {
        chat.title = userDisplayText.length > 20 ? userDisplayText.slice(0, 20) + "..." : userDisplayText;
      }

      chat.messages.push({
        role: "user",
        content: pendingFile ? `${userDisplayText}\n\n[첨부 파일: ${pendingFile.name || "attachment"}]` : userDisplayText,
        mode: "",
        imageName: pendingFile ? (pendingFile.name || "clipboard-image") : "",
        imagePreviewUrl: pendingFile ? pendingPreviewUrl : "",
      });
      renderHistory();
      renderCurrentChat(true);
      saveChats();

      messageInput.value = "";
      autoResizeTextarea();
      clearPendingImage(false);
      state.loading = true;
      sendBtn.disabled = true;
      typingRow.classList.add("show");
      scrollMessagesToBottom();

      try {
        const attachmentText = pendingFile ? await processOcrFile(pendingFile) : "";
        const response = await fetch(API + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: requestMessage,
            history: buildHistory(chat.messages.slice(0, -1)),
            model: modelSelect.value,
            web_search_enabled: webSearchToggle.checked,
            conversation_id: chat.id,
            attachment_text: attachmentText,
            attachment_name: pendingFile ? (pendingFile.name || "clipboard-image") : null,
          }),
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || "Chat request failed");
        }

        chat.messages.push({
          role: "assistant",
          content: payload.answer || "",
          mode: payload.mode || "general",
        });
      } catch (error) {
        chat.messages.push({
          role: "assistant",
          content: "오류가 발생했습니다: " + error.message,
          mode: "error",
        });
      } finally {
        state.loading = false;
        sendBtn.disabled = false;
        typingRow.classList.remove("show");
        renderHistory();
        renderCurrentChat(true);
        saveChats();
        messageInput.focus();
      }
    }

    function promptNewProject() {
      const name = window.prompt("프로젝트 이름을 입력하세요.", "새 프로젝트");
      if (name === null) {
        return;
      }
      createProject(name);
    }

    newChatBtn.addEventListener("click", () => {
      createChat(state.currentProjectId || ensureDefaultProject());
      if (!isDesktopViewport()) {
        setSidebarOpen(false);
      }
    });
    sidebarToggleBtn.addEventListener("click", toggleSidebar);
    sidebarRevealBtn.addEventListener("click", toggleSidebar);
    projectNavBtn.addEventListener("click", () => {
      state.projectsCollapsed = !state.projectsCollapsed;
      renderHistory();
    });
    addProjectBtn.addEventListener("click", promptNewProject);
    shareChatBtn.addEventListener("click", handleShareChat);
    attachBtn.addEventListener("click", () => ocrFileInput.click());
    ocrFileInput.addEventListener("change", handleOcrSelection);
    clearAttachmentBtn.addEventListener("click", clearPendingImage);
    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("input", autoResizeTextarea);
    messageInput.addEventListener("paste", handleImagePaste);
    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
    window.addEventListener("resize", applySidebarState);

    applySidebarState();
    autoResizeTextarea();
    loadModels();
    loadHealth();
    loadChats();
    setInterval(loadHealth, 30000);
  </script>
</body>
</html>
