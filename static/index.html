<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PublicGPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=SUIT:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2efe8;
      --panel: rgba(255, 250, 242, 0.94);
      --panel-strong: #fffdf8;
      --line: #d7cdbd;
      --text: #2d2418;
      --muted: #7b6b57;
      --accent: #bf5b2c;
      --accent-soft: #f2d9cc;
      --user: #efe2cc;
      --assistant: #fffaf2;
      --shadow: 0 18px 40px rgba(89, 64, 38, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SUIT", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(191, 91, 44, 0.16), transparent 30%),
        linear-gradient(180deg, #f8f4ec 0%, #efe9dc 100%);
    }

    .shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: rgba(255, 250, 242, 0.78);
      backdrop-filter: blur(12px);
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand h1 {
      margin: 0;
      font: 700 28px/1 "Space Grotesk", sans-serif;
      letter-spacing: -0.04em;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .new-chat {
      border: 0;
      background: var(--accent);
      color: #fff;
      border-radius: 14px;
      padding: 14px 16px;
      font: 600 15px/1 "SUIT", sans-serif;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .history-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .history {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: auto;
      min-height: 0;
    }

    .history-item {
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.55);
      cursor: pointer;
    }

    .history-item.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .history-item strong {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .history-item span {
      color: var(--muted);
      font-size: 12px;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 249, 241, 0.78);
      backdrop-filter: blur(12px);
    }

    .topbar h2 {
      margin: 0;
      font-size: 18px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    select,
    .toggle {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-strong);
      color: var(--text);
      padding: 10px 12px;
      font: 500 13px/1 "SUIT", sans-serif;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .messages {
      flex: 1;
      overflow: auto;
      padding: 28px 22px 18px;
    }

    .stack {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .welcome,
    .message {
      border: 1px solid rgba(215, 205, 189, 0.9);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .welcome {
      padding: 28px;
    }

    .welcome h3 {
      margin: 0 0 10px;
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      max-width: 640px;
    }

    .message {
      padding: 18px 20px;
    }

    .message.user {
      background: var(--user);
    }

    .message.assistant {
      background: var(--assistant);
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .role {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.02em;
    }

    .mode {
      color: var(--muted);
      font-size: 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
    }

    .content {
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 15px;
    }

    .typing {
      color: var(--muted);
      font-size: 14px;
      padding: 0 6px;
      display: none;
    }

    .typing.show {
      display: block;
    }

    .composer {
      border-top: 1px solid var(--line);
      background: rgba(255, 249, 241, 0.78);
      backdrop-filter: blur(12px);
      padding: 18px 22px 24px;
    }

    .composer-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      max-height: 220px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px 18px;
      background: var(--panel-strong);
      font: 500 15px/1.6 "SUIT", sans-serif;
      color: var(--text);
    }

    textarea:focus,
    select:focus {
      outline: 2px solid rgba(191, 91, 44, 0.2);
      border-color: var(--accent);
    }

    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
    }

    .send {
      border: 0;
      background: var(--accent);
      color: #fff;
      border-radius: 14px;
      padding: 14px 22px;
      font: 700 14px/1 "SUIT", sans-serif;
      cursor: pointer;
    }

    .send:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    @media (max-width: 900px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <h1>PublicGPT</h1>
        <p>문서 관리 없이 대화만 남긴 가벼운 Ollama 챗 UI입니다.</p>
      </div>
      <button class="new-chat" id="newChatBtn" type="button">새 채팅</button>
      <div class="history-title">Chat Sessions</div>
      <div class="history" id="historyList"></div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h2 id="chatTitle">새 채팅</h2>
        <div class="controls">
          <select id="modelSelect"></select>
          <label class="toggle">
            <input type="checkbox" id="webSearchToggle" checked>
            <span>웹 검색</span>
          </label>
        </div>
      </div>

      <section class="messages">
        <div class="stack" id="messageStack">
          <div class="welcome">
            <h3>채팅만 남겼습니다.</h3>
            <p>업로드, 문서 보관함, 벡터 문서 검색 UI는 제거했습니다. 이제 이 화면은 일반 대화와 선택적 웹 검색만 처리합니다.</p>
          </div>
          <div class="typing" id="typing">응답 생성 중...</div>
        </div>
      </section>

      <section class="composer">
        <div class="composer-inner">
          <textarea id="messageInput" placeholder="질문을 입력하세요. Shift+Enter는 줄바꿈, Enter는 전송입니다."></textarea>
          <div class="composer-actions">
            <div class="status" id="statusText">서버 상태 확인 중...</div>
            <button class="send" id="sendBtn" type="button">보내기</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API = window.location.origin;
    const state = {
      chats: {},
      currentChatId: null,
      loading: false
    };

    const historyList = document.getElementById("historyList");
    const messageStack = document.getElementById("messageStack");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const chatTitle = document.getElementById("chatTitle");
    const modelSelect = document.getElementById("modelSelect");
    const statusText = document.getElementById("statusText");
    const webSearchToggle = document.getElementById("webSearchToggle");

    function createChat() {
      const id = "chat_" + Date.now();
      state.chats[id] = {
        id,
        title: "새 채팅",
        messages: [],
        createdAt: Date.now()
      };
      state.currentChatId = id;
      renderHistory();
      renderCurrentChat();
      saveChats();
    }

    function ensureChat() {
      if (!state.currentChatId || !state.chats[state.currentChatId]) {
        createChat();
      }
      return state.chats[state.currentChatId];
    }

    function renderHistory() {
      const chats = Object.values(state.chats).sort((a, b) => b.createdAt - a.createdAt);
      historyList.innerHTML = "";

      if (!chats.length) {
        const empty = document.createElement("div");
        empty.className = "history-item";
        empty.innerHTML = "<strong>아직 채팅이 없습니다</strong><span>새 채팅을 시작해 보세요.</span>";
        historyList.appendChild(empty);
        return;
      }

      chats.forEach((chat) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "history-item" + (chat.id === state.currentChatId ? " active" : "");
        item.innerHTML = `<strong>${escapeHtml(chat.title)}</strong><span>${escapeHtml(lastPreview(chat))}</span>`;
        item.addEventListener("click", () => {
          state.currentChatId = chat.id;
          renderHistory();
          renderCurrentChat();
        });
        historyList.appendChild(item);
      });
    }

    function lastPreview(chat) {
      const last = chat.messages[chat.messages.length - 1];
      return last ? last.content.slice(0, 42) : "대화를 시작해 보세요.";
    }

    function renderCurrentChat() {
      const chat = ensureChat();
      chatTitle.textContent = chat.title;

      messageStack.innerHTML = `
        <div class="welcome">
          <h3>채팅만 남겼습니다.</h3>
          <p>업로드, 문서 보관함, 벡터 문서 검색 UI는 제거했습니다. 이제 이 화면은 일반 대화와 선택적 웹 검색만 처리합니다.</p>
        </div>
        <div class="typing" id="typing">응답 생성 중...</div>
      `;

      chat.messages.forEach((message) => appendMessage(message, false));
      scrollToBottom();
    }

    function appendMessage(message, shouldScroll = true) {
      const typingNode = document.getElementById("typing");
      const card = document.createElement("article");
      card.className = "message " + message.role;

      const mode = message.mode ? `<span class="mode">${escapeHtml(message.mode)}</span>` : "";
      const roleLabel = message.role === "user" ? "User" : "Assistant";
      card.innerHTML = `
        <div class="meta">
          <span class="role">${roleLabel}</span>
          ${mode}
        </div>
        <div class="content">${escapeHtml(message.content)}</div>
      `;

      messageStack.insertBefore(card, typingNode);
      if (shouldScroll) {
        scrollToBottom();
      }
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value || "";
      return div.innerHTML;
    }

    async function loadModels() {
      try {
        const response = await fetch(API + "/models");
        const payload = await response.json();
        modelSelect.innerHTML = "";
        (payload.available || []).forEach((model) => {
          const option = document.createElement("option");
          option.value = model.trim();
          option.textContent = model.trim();
          if (model.trim() === payload.default) {
            option.selected = true;
          }
          modelSelect.appendChild(option);
        });
      } catch (error) {
        statusText.textContent = "모델 목록을 불러오지 못했습니다.";
      }
    }

async function loadHealth() {
      try {
        const response = await fetch(API + "/health");
        const payload = await response.json();
        const provider = payload.provider || "llm";
        statusText.textContent = payload.llm === "connected"
          ? `${provider} connected · default model ${payload.model}`
          : `${provider} disconnected`;
      } catch (error) {
        statusText.textContent = "Failed to load server health.";
      }
    }

    async function loadChats() {
      try {
        const response = await fetch(API + "/ui-state/chats");
        const payload = await response.json();
        state.chats = payload.chats || {};
      } catch (error) {
        state.chats = {};
      }

      const ids = Object.keys(state.chats);
      if (ids.length) {
        state.currentChatId = ids.sort((a, b) => state.chats[b].createdAt - state.chats[a].createdAt)[0];
      } else {
        createChat();
        return;
      }

      renderHistory();
      renderCurrentChat();
    }

    async function saveChats() {
      try {
        await fetch(API + "/ui-state/chats", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chats: state.chats })
        });
      } catch (error) {
        console.warn("Failed to save chats", error);
      }
    }

    function buildHistory(messages) {
      return messages.map((message) => ({
        role: message.role,
        content: message.content
      }));
    }

    async function sendMessage() {
      if (state.loading) {
        return;
      }

      const text = messageInput.value.trim();
      if (!text) {
        return;
      }

      const chat = ensureChat();
      if (chat.title === "새 채팅") {
        chat.title = text.length > 20 ? text.slice(0, 20) + "..." : text;
      }

      const userMessage = { role: "user", content: text, mode: "" };
      chat.messages.push(userMessage);
      renderHistory();
      renderCurrentChat();
      saveChats();

      messageInput.value = "";
      state.loading = true;
      sendBtn.disabled = true;
      document.getElementById("typing").classList.add("show");
      scrollToBottom();

      try {
        const response = await fetch(API + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            history: buildHistory(chat.messages.slice(0, -1)),
            model: modelSelect.value,
            web_search_enabled: webSearchToggle.checked
          })
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || "Chat request failed");
        }

        const assistantMessage = {
          role: "assistant",
          content: payload.answer || "",
          mode: payload.mode || "general"
        };
        chat.messages.push(assistantMessage);
        saveChats();
        renderHistory();
        renderCurrentChat();
      } catch (error) {
        chat.messages.push({
          role: "assistant",
          content: "오류가 발생했습니다: " + error.message,
          mode: "error"
        });
        saveChats();
        renderHistory();
        renderCurrentChat();
      } finally {
        state.loading = false;
        sendBtn.disabled = false;
        document.getElementById("typing").classList.remove("show");
        messageInput.focus();
      }
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        messageStack.parentElement.scrollTop = messageStack.parentElement.scrollHeight;
      });
    }

    newChatBtn.addEventListener("click", createChat);
    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    loadModels();
    loadHealth();
    loadChats();
    setInterval(loadHealth, 30000);
  </script>
</body>
</html>
